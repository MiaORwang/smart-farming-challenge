function chartSvg(seed){const colors=['#4087b1','#d89a47','#67a37b'];return `<svg viewBox="0 0 340 105" aria-label="Simulated acceleration chart"><g stroke="#d9e5d6" stroke-width="1"><path d="M0 20H340 M0 52H340 M0 85H340"/></g>${colors.map((c,j)=>`<polyline points="${Array.from({length:19},(_,i)=>`${i*19},${Math.round(49+Math.sin(i*.85+seed+j*1.7)*14+Math.cos(i*1.9+j)*11+j*4)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round"/>`).join('')}</svg><div class="legend">● X &nbsp; ● Y &nbsp; ● Z &nbsp; · ${esc(tr('data'))}</div>`}

function sensorPanel(id,buffalo=false){let i=id;let step=buffalo?S.buffZone[i]:S.cowStep;let online=buffalo||(step===0||step===3);let rssi=buffalo?[-56,-62,-88,-67,-73][i]:online?(-51-i*5)+' dBm':tr('noSignal');let temp=buffalo?[21.2,20.5,19.8][step]+i*.2:[20.8,21.6,23.1,20.9][step]+i*.2;return `<div class="panel sensor-panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:7px"><h3 class="heading" style="margin:0">${buffalo?'Buffalo '+String.fromCharCode(65+i):'Cow '+(234+i)} · Necktag©</h3><span class="status ${online?'':'off'}">${online?tr('connected'):tr('offline')}</span></div><div class="readings" style="margin-top:13px">${online?reading(tr('battery'),(3.70+i*.03+(step===2?.02:0)).toFixed(2)+' V')+reading(tr('light'),String([280,340,870,260][buffalo?Math.min(step,3):step]+i*31))+reading(tr('rssi'),rssi)+reading(tr('temp'),temp.toFixed(1)+' °C')+reading(tr('humidity'),(buffalo?[82,69,75][step]:[67,71,56,68][step])+i+' %')+reading(tr('pressure'),(1011+i*.4).toFixed(1)+' hPa'):`<div class="offline-empty">${S.lang==='de'?'Keine Gateway-Verbindung: Es werden keine Messwerte empfangen.':'No gateway connection: no readings are received.'}</div>`}</div></div>`}

function pageHead(title,intro){return `<div class="sectionhead"><button class="btn small" onclick="go('home')">← ${tr('back')}</button><div><h1>${esc(title)}</h1><div class="sub">${esc(intro)}</div></div></div>`}
function screenshotPrompt(){return `<div class="screenshot-note">📸 ${S.lang==='de'?'Bitte mache einen Screenshot deines Ergebnisses. Drei Screenshots mit jeweils vollständig richtigen Antworten aus den drei Spielen können gegen ein kleines Geschenk eingetauscht werden.':'Please take a screenshot of your result. Three screenshots showing fully correct answers in all three games can be exchanged for a small gift.'}</div>`}
function cow(){let step=S.cowStep;let places=[tr('barn'),tr('pasture'),tr('milk'),tr('backBarn')];return `${pageHead(tr('cow'),tr('introCow'))}<div class="game-stack"><div class="panel"><div class="scene compact-scene">${farmScene('cow',step)}<div class="scene-caption">📍 ${places[step]} · ${['07:00','10:00','16:00','17:00'][step]}</div></div><div class="timeline compact-timeline">${places.map((p,i)=>`<span class="${i===step?'current':''}">${['07:00','10:00','16:00','17:00'][i]} ${p}</span>`).join('')}</div><div class="progress">${places.map((_,i)=>`<span class="${i<=step?'on':''}"></span>`).join('')}</div><div class="buttons"><button class="btn primary" ${step===3?'disabled':''} onclick="cowAdvance()">${tr('advance')} →</button><button class="btn secondary" onclick="cowReset()">↻ ${tr('restart')}</button></div><div class="animalstrip compact-animals">${Array.from({length:5},(_,i)=>`<button class="animalbtn ${S.cow===i?'selected':''}" onclick="selectCow(${i})"><span class="emoji">🐄</span>${234+i}<small>${step===1||step===2?'◌ Offline':'● Online'}</small></button>`).join('')}</div></div>${sensorPanel(S.cow)}${cowQuiz()}</div>`}
function buffalo(){let i=S.buff;let places=[tr('water'),tr('grass'),tr('rest')];return `${pageHead(tr('buffalo'),tr('introBuff'))}<div class="game-stack"><div class="panel"><div class="scene compact-scene">${farmScene('buffalo')}<div class="scene-caption">🌿 Wiedervernässtes Moor · ${tr('data')}</div></div><div class="animalstrip compact-animals">${Array.from({length:5},(_,n)=>`<button class="animalbtn ${S.buff===n?'selected':''}" onclick="selectBuff(${n})"><span class="emoji">🐃</span>${String.fromCharCode(65+n)}<small>${places[S.buffZone[n]]}</small></button>`).join('')}</div><h3 class="heading" style="margin-top:17px">${tr('move')} · Buffalo ${String.fromCharCode(65+i)}</h3><div class="scene-actions">${places.map((z,n)=>`<button class="btn zonebtn ${S.buffZone[i]===n?'primary':''}" onclick="buffMove(${n})">${['💧','🌱','🌾'][n]} ${z}</button>`).join('')}</div></div>${sensorPanel(i,true)}<div class="panel quiz-panel"><h3 class="question-box">${tr('findWeak')}</h3><div class="buttons">${Array.from({length:5},(_,n)=>`<button class="btn small ${S.buffAnswer===n?'primary':''}" onclick="buffGuess(${n})">${String.fromCharCode(65+n)}</button>`).join('')}</div><button class="btn primary" onclick="buffCheck()">${tr('check')}</button>${S.buffChecked?`<div class="notice ${S.buffAnswer===2?'good':''}">${S.buffAnswer===2?tr('correct')+' '+tr('buffWin'):tr('incorrect')}</div>`:''}${S.buffChecked&&S.buffAnswer===2?screenshotPrompt():''}</div></div>`}

{de:'Welche Bereiche haben jeweils Gefiederschäden, Hautverletzungen UND Entzündungen als Bewertungsarten?',en:'Which body regions are each assessed for feather damage, skin injuries AND inflammation?',aDe:['Hals','Rücken, Stoßfedern, Bauch','Kamm','Brust'],aEn:['Neck','Back, tail feathers, abdomen','Comb','Breast'],right:1,whyDe:'Rücken, Stoßfedern und Bauch umfassen jeweils alle drei Bewertungsarten.',whyEn:'Back, tail feathers and abdomen each include all three assessment types.'},

{de:'Bei den Stoßfedern fehlen kleine Daunenfedern. Die Federkiele der großen Stoßfedern, die Öldrüse und nackte Hautbereiche sind deutlich zu erkennen. Welchen Score würden Sie vergeben?',en:'Small down feathers are missing around the tail feathers. The shafts of the large tail feathers, the preen gland and bare skin areas are clearly visible. Which score would you assign?',aDe:['Score 0','Score 1','Score 2','Score 3'],aEn:['Score 0','Score 1','Score 2','Score 3'],right:2,whyDe:'Die deutlich sichtbaren Gefiederschäden entsprechen in dieser vierstufigen Boniturskala Score 2.',whyEn:'Clearly visible feather damage corresponds to score 2 on this four-level scoring scale.'}
];
function hen(){if(S.henResults)return henResult();let de=S.lang==='de',part=HEN_PARTS.find(p=>p[0]===S.henPart)||HEN_PARTS[0];let q=HEN_Q[S.hen];let allVisited=HEN_PARTS.filter(p=>S.henVisited.includes(p[0])).length;return `${pageHead(tr('hen'),tr('introHen'))}<div class="layout"><div class="panel"><h3 class="heading">${de?'Entdecke die Bewertungsbereiche':'Explore assessment areas'} · ${allVisited}/6</h3><div class="hen-stage" style="position:relative">${svgHen(0)}<div class="hen-hotspots">${HEN_PARTS.map(p=>`<button type="button" class="hen-hotspot hotspot-${p[0]} ${S.henPart===p[0]?'active':''}" onclick="henPart('${p[0]}')" aria-label="${de?p[1]:p[2]}">${de?p[1]:p[2]}</button>`).join('')}</div></div><div class="hen-regions">${HEN_PARTS.map(p=>`<button class="btn small ${S.henPart===p[0]?'primary':''}" onclick="henPart('${p[0]}')">${de?p[1]:p[2]} · ${p[3].length}</button>`).join('')}</div><div class="notice good"><b>${de?part[1]:part[2]} / ${de?part[2]:part[1]} · ${part[3].length} ${de?'Bewertungsarten':'assessment types'}</b><ul class="damage-list">${part[3].map(t=>`<li>${esc(de?t[0]:t[1])}</li>`).join('')}</ul></div><p class="smalltext">${de?'Die angezeigten Schadensarten basieren auf einer vereinfachten Auswahl der Daten des Projekts KI-Tierwohl.':'The displayed damage types are based on a simplified selection of data from the KI-Tierwohl project.'}</p></div><div class="panel"><div class="pill">${de?'Frage':'Question'} ${S.hen+1} / ${HEN_Q.length}</div><div class="progress">${HEN_Q.map((_,i)=>`<span class="${i<=S.hen?'on':''}"></span>`).join('')}</div>${S.hen>=4?`<div class="scoring-guide"><b>${de?'Vierstufige Boniturskala zur Beurteilung von Integumentschäden':'Four-level scoring scale for integument damage'}</b><div class="guide-grid"><span>0 · ${de?'Keine':'None'}</span><span>1 · ${de?'Moderat':'Moderate'}</span><span>2 · ${de?'Deutlich':'Distinct'}</span><span>3 · ${de?'Stark':'Severe'}</span></div><p class="smalltext">${de?'Vereinfachte Spielregel, keine validierte Bonituranleitung.':'Simplified game rule, not a validated assessment protocol.'}</p></div>`:''}<h3 style="line-height:1.5">${esc(de?q.de:q.en)}</h3><div class="hen-choices">${(de?q.aDe:q.aEn).map((a,i)=>`<button class="hen-choice ${S.henAnswers[S.hen]===i?'chosen':''}" onclick="henChoose(${i})"><b>${String.fromCharCode(65+i)}</b><span>${esc(a)}</span></button>`).join('')}</div><div class="buttons"><button class="btn primary" onclick="henNext()" ${S.henAnswers[S.hen]===undefined?'disabled':''}>${S.hen===HEN_Q.length-1?tr('finish'):(de?'Nächste Frage':'Next question')} →</button><button class="btn secondary" onclick="henReset()">↻ ${tr('restart')}</button></div><p class="smalltext">${de?'Die Lösungen erscheinen erst nach Abschluss aller sechs Fragen.':'Answers are revealed after all six questions.'}</p></div></div>`}
function henResult(){let de=S.lang==='de';let correct=HEN_Q.reduce((n,q,i)=>n+(S.henAnswers[i]===q.right?1:0),0),pts=Math.round(correct/HEN_Q.length*100);return `${pageHead(tr('result'),tr('hen'))}<div class="panel"><div style="text-align:center;padding:20px"><div style="font-size:56px">${correct===HEN_Q.length?'🏆':'🌱'}</div><div class="result">${pts} / 100</div><h2>${correct===HEN_Q.length?tr('passed'):tr('retry')}</h2><p>${correct}/${HEN_Q.length} ${de?'richtige Antworten':'correct answers'}</p><div class="buttons" style="justify-content:center"><button class="btn primary" onclick="henReset()">↻ ${tr('restart')}</button><button class="btn" onclick="go('home')">${tr('back')}</button></div>${correct===HEN_Q.length?screenshotPrompt():`<div class="screenshot-note">📸 ${de?'Für das Geschenk werden drei Screenshots mit vollständig richtigen Antworten benötigt.':'Three screenshots with fully correct answers are needed for the gift.'}</div>`}</div><h3>${tr('answers')}</h3>${HEN_Q.map((q,i)=>`<div class="quizline"><b>${i+1}. ${esc(de?q.de:q.en)}</b><p>${de?'Deine Antwort':'Your answer'}: ${esc((de?q.aDe:q.aEn)[S.henAnswers[i]])} ${S.henAnswers[i]===q.right?'✓':'✗'}</p><p>${de?'Richtige Antwort':'Correct answer'}: <b>${esc((de?q.aDe:q.aEn)[q.right])}</b></p><p class="smalltext">${esc(de?q.whyDe:q.whyEn)}</p></div>`).join('')}<p class="notice">${de?'Alle Fragen und Referenzantworten sind feste, vereinfachte Spielbeispiele und wurden fachlich geprüft.':'All questions and reference answers are fixed, simplified game examples and have been reviewed by subject-matter experts.'}</p></div>`}
function cowQuiz(){let de=S.lang==='de';let questions=de?[['Wo ist das Gateway installiert?',['Im Stall','Auf der Weide','Am Halsband'],0],['Was bedeutet Offline während der Weidezeit?',['Alle Daten sind verloren','Die Daten werden später automatisch nachgesendet','Die Kuh ist krank'],0],['Wann werden Daten übertragen?',['Bei erneuter Gateway-Verbindung','Immer genau um 16 Uhr','Echtzeit'],2],['Welche Umweltvariable wird nicht übertragen?',['Temperatur','Luftfeuchtigkeit','Luftdruck','Windgeschwindigkeit'],3]]:[['Where is the gateway installed?',['In the barn','On the pasture','On the collar'],0],['What does offline on pasture mean?',['All data is lost','The data are automatically sent later','The cow is sick'],0],['When are data transmitted?',['After reconnecting to the gateway','Always at 4 PM','In real time'],2],['Which environmental variable is not transmitted?',['Temperature','Air humidity','Air pressure','Wind speed'],3]];let answered=Object.keys(S.cowAnswers).length,points=questions.reduce((sum,q,i)=>sum+(S.cowAnswers[i]===q[2]?25:0),0);return `<div class="panel" style="margin-top:16px"><h3 class="heading">🎯 ${de?'Vier Fragen zum Necktag':'Four Necktag questions'} · ${points}/100</h3><p class="smalltext">${de?'Jede richtige Antwort bringt 25 Punkte. Nur mit 100 Punkten bestanden.':'Each correct answer earns 25 points. Pass only with 100 points.'}</p>${questions.map((q,i)=>`<div class="quizline"><div class="question-box">${i+1}. ${q[0]}</div><div class="scorebuttons" style="flex-wrap:wrap">${q[1].map((a,j)=>`<button style="min-width:130px;flex:1 1 150px" class="${S.cowAnswers[i]===j?'chosen':''}" onclick="cowAnswer(${i},${j})">${a}</button>`).join('')}</div></div>`).join('')}${answered===4?`<div class="notice ${points===100?'good':''}"><b>${points===100?(de?'Bestanden!':'Passed!'):(de?'Versuche es erneut!':'Try again!')}</b> · ${points}/100</div>${points===100?screenshotPrompt():''}`:''}</div>`}function cowAnswer(i,j){S.cowAnswers[i]=j;render()}
function render(){document.documentElement.lang=S.lang;document.getElementById('app').innerHTML=header()+(S.page==='home'?home():S.page==='cow'?cow():S.page==='buffalo'?buffalo():hen())+`<p class="footnote combined-disclaimer">ⓘ ${tr('notice')}</p><footer class="footer">🔒 ${tr('privacy')}<br><div class="institution-address"><strong>${S.lang==='de'?'Universität Rostock':'University of Rostock'}</strong><br>${S.lang==='de'?'Fakultät für Agrar, Bau und Umwelt':'Faculty of Agriculture, Civil and Environmental Engineering'}<br>${S.lang==='de'?'Landwirtschaftliche Verfahrenstechnik':'Agricultural Process Engineering'}<br>Justus-von-Liebig-Weg 6b<br>18059 Rostock<br>${S.lang==='de'?'Deutschland':'Germany'}</div>Smart Farming Challenge · EuroTier 2026 · Prototype v1.2 · Necktag©</footer>`}
function language(lang){S.lang=lang;render()}function go(page){S.page=page;render();window.scrollTo(0,0)}function selectCow(i){S.cow=i;render()}function cowAdvance(){if(S.cowStep<3)S.cowStep++;S.cowMsg='';render()}function cowReset(){S.cowStep=0;S.cowSynced=false;S.cowAnswers={};S.cowMsg='';render()}function selectBuff(i){S.buff=i;render()}function buffMove(i){S.buffZone[S.buff]=i;render()}function buffGuess(i){S.buffAnswer=i;S.buffChecked=false;render()}function buffCheck(){if(S.buffAnswer===null)return;S.buffChecked=true;render()}function henPart(id){S.henPart=id;if(!S.henVisited.includes(id))S.henVisited.push(id);render()}function henChoose(v){S.henAnswers[S.hen]=v;render()}function henNext(){if(S.henAnswers[S.hen]===undefined)return;if(S.hen===HEN_Q.length-1)S.henResults=true;else S.hen++;render();window.scrollTo(0,0)}function henReset(){S.hen=0;S.henAnswers={};S.henResults=false;S.henPart='back';S.henVisited=['back'];render()}render();
</script></body></html>
